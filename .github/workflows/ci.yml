  # CI/CD — test → build → deploy (Render)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bỏ test_cp5 (cần bản deploy đang sống), test_bonus_cicd (tự kiểm tra
      # badge của chính workflow này) và các test Docker (job build lo phần đó).
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }}

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Free tier build + khởi động mất 1–3 phút; thử lại tới khi /health xanh.
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health"; then
              echo
              curl -fsS "${{ vars.PUBLIC_URL }}/ready"
              exit 0
            fi
            echo "chưa sẵn sàng, thử lại sau 15s ($i/20)"
            sleep 15
          done
          exit 1
